name: Forgie crons

# Render's free tier runs no cron internally, so every app/api/cron/* route
# needs an external trigger. Documented as Option B in
# docs/FORGIE_DEPLOYMENT.md ("Wire the cron jobs"); SECURITY_TODO.md flagged
# that it was never set up ("confirm it's configured, or the jobs silently
# never fire").
#
# SCHEDULED: all six jobs. The four older ones (daily-log drafts, standup
# digest, project health, disappearing-message cleanup) were manual-only until
# 14 Oct 2026 because they ran as the default company only; they now run once
# per company (lib/cron.ts forEachActiveOrg), and Kavya asked for all four to
# be scheduled. Every job can still be run by hand from the Actions tab. To add
# a schedule: add its cron line below AND its case in "Pick endpoint".
#
# Each schedule is matched by its EXACT cron string via github.event.schedule,
# so every schedule must stay textually unique.
#
# Requires a CRON_SECRET repository secret (Settings → Secrets and
# variables → Actions) matching the CRON_SECRET env var set on Render.

on:
  schedule:
    - cron: '30 20 * * *'   # rag-stale-sweep — 2:00am IST (low traffic; its 48 h grace window means daily is plenty)
    - cron: '*/15 * * * *'  # rag-retry       — every 15 min (each row has its own backoff; most runs find nothing due)
    - cron: '30 12 * * *'   # daily-log-drafts     — 6:00pm IST
    - cron: '30 3 * * *'    # standup-digest       — 9:00am IST
    - cron: '0 4 * * *'     # project-health       — 9:30am IST
    - cron: '0 */4 * * *'   # disappearing-cleanup — every 4 hours
  workflow_dispatch:         # manual "Run workflow" from the Actions tab
    inputs:
      endpoint:
        description: 'Cron route to trigger (path under /api/cron/)'
        required: true
        default: 'rag-retry'
        type: choice
        options:
          - rag-retry
          - rag-stale-sweep
          - daily-log-drafts
          - standup-digest
          - project-health
          - disappearing-cleanup

# Never let two runs of the same job overlap (the app also guards against it).
concurrency:
  group: forgie-cron-${{ github.event.schedule || github.event.inputs.endpoint }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick endpoint for this schedule
        if: github.event_name == 'schedule'
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '30 20 * * *')  echo "path=rag-stale-sweep" >> "$GITHUB_OUTPUT" ;;
            '*/15 * * * *') echo "path=rag-retry" >> "$GITHUB_OUTPUT" ;;
            '30 12 * * *')  echo "path=daily-log-drafts" >> "$GITHUB_OUTPUT" ;;
            '30 3 * * *')   echo "path=standup-digest" >> "$GITHUB_OUTPUT" ;;
            '0 4 * * *')    echo "path=project-health" >> "$GITHUB_OUTPUT" ;;
            '0 */4 * * *')  echo "path=disappearing-cleanup" >> "$GITHUB_OUTPUT" ;;
            *) echo "No endpoint mapped for schedule '${{ github.event.schedule }}'" >&2; exit 1 ;;
          esac

      - name: POST to the cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # The app's address. Set the repository variable APP_URL (Settings >
          # Secrets and variables > Actions > Variables) when the app moves.
          APP_URL: ${{ vars.APP_URL || 'https://rig-forge.onrender.com' }}
          ENDPOINT: ${{ github.event.inputs.endpoint || steps.pick.outputs.path }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set; skipping." >&2
            exit 0
          fi
          echo "Triggering /api/cron/$ENDPOINT"
          curl -sS --fail-with-body --max-time 600 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "${APP_URL%/}/api/cron/$ENDPOINT"
